apiVersion: meili.operator.dev/v1beta1
kind: Server
metadata:
  name: {{ .Values.server.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
spec:
  image: {{ .Values.server.image }}
  pullPolicy: {{ .Values.server.pullPolicy | default nil }}
  {{- if .Values.server.imagePullSecrets }}
  imagePullSecrets:
  {{- range .Values.server.imagePullSecrets }}
    - name: {{ .name | default . }}
  {{- end }}
  {{- end }}
  replicas: {{ .Values.server.replicas }}
  storage: {{ .Values.server.storage }}
  port: {{ .Values.server.port }}
  incompatiblePolicy: {{ .Values.server.incompatiblePolicy }}
  data:
    migrateOnUpdate: {{ .Values.server.migrateOnUpdate }}
