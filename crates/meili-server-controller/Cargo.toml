[package]
name = "meili-server-controller"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.100"
tracing = "0.1.41"
rand = "0.9.2"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["time"] }
kube = { version = "2.0.1", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.26.0", features = ["latest", "schemars"] }
reqwest = { version = "0.13.0", default-features = false, features = ["rustls-tls", "json"] }
meili-crds = { path = "../meili-crds" }
meili-shared = { path = "../meili-shared" }
time = { version = "0.3.44", features = ["parsing", "formatting"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
axum = { version = "0.8.7", default-features = false, features = ["tokio", "http1"] }
