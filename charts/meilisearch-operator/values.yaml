image:
  repository: mbround18/meilisearch-operator
  tag: latest
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nameOverride: ""
fullnameOverride: ""

rbac:
  create: true

namespace: meilisearch-operator
createNamespace: false

annotations: {}
namespaceAnnotations: {}
serviceAccount:
  annotations: {}
podAnnotations: {}

metrics:
  enabled: true
  port: 9090
  addr: "0.0.0.0:9090"
  service:
    type: ClusterIP
    annotations: {}
    labels: {}
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []
    metricRelabelings: []

networkPolicy:
  # Enable NetworkPolicy resources for the operator
  enabled: true
  egress:
    # Enable egress restrictions (set false to disable all NP egress rules)
    enabled: true
    # Allow DNS egress for name resolution (UDP/TCP 53)
    allowDns: true
    ports:
      - port: 7700
        protocol: TCP
    # Restrict Meilisearch egress to specific namespaces by label selector
    namespaceSelector: {}
    # Or explicitly list allowed namespaces by name (uses metadata.name label)
    allowedNamespaces: []
    # Allow access to Kubernetes API server (HTTPS 443). Adjust CIDRs to your cluster API IPs.
    kubeApi:
      enabled: true
      cidrs:
        - 10.43.0.1/32
