{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.egress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meilisearch-operator-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: meilisearch-operator
  policyTypes:
    - Egress
  egress:
    {{- if .Values.networkPolicy.egress.allowDns }}
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.egress.kubeApi.enabled }}
    {{- $userCidrs := .Values.networkPolicy.egress.kubeApi.cidrs }}
    {{- $kubeSvc := (lookup "v1" "Service" "default" "kubernetes") }}
    {{- $kubeIP := "" }}
    {{- if $kubeSvc }}
    {{- $kubeIP = $kubeSvc.spec.clusterIP | default "" }}
    {{- end }}
    {{- if or $userCidrs $kubeIP }}
    - to:
        {{- if $userCidrs }}
        {{- range $userCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- else if $kubeIP }}
        - ipBlock:
            cidr: {{ printf "%s/32" $kubeIP | quote }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- end }}
    - to:
        {{- if .Values.networkPolicy.egress.allowedNamespaces }}
        {{- range .Values.networkPolicy.egress.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- else }}
        - namespaceSelector:
            {{- toYaml (.Values.networkPolicy.egress.namespaceSelector | default dict) | nindent 12 }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.egress.ports }}
        - port: {{ .port }}
          protocol: {{ .protocol | default "TCP" }}
        {{- end }}
{{- end }}
