[package]
name = "meilisearch-operator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
rand = "0.9.2"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "time", "signal"] }
futures = "0.3.31"
time = { version = "0.3.44", features = ["parsing", "formatting"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"

kube = { version = "2.0.1", features = ["runtime", "derive"] }
schemars = "1.1.0"
serde_yaml = "0.9.34-deprecated"
meili-index-controller = { path = "../meili-index-controller" }
meili-key-controller = { path = "../meili-key-controller" }
meili-server-controller = { path = "../meili-server-controller" }
meili-crds = { path = "../meili-crds" }
meili-metrics = { path = "../meili-metrics" }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1.0.145"
axum = { version = "0.8.7", default-features = false, features = ["tokio", "http1"] }
