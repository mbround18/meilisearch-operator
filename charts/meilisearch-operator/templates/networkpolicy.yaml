{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.egress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meilisearch-operator-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: meilisearch-operator
  policyTypes:
    - Egress
  egress:
    {{- if .Values.networkPolicy.egress.allowDns }}
    {{- $dnsSvc := (lookup "v1" "Service" "kube-system" "kube-dns") }}
    {{- $dnsIP := "" }}
    {{- if $dnsSvc }}
    {{- $dnsIP = $dnsSvc.spec.clusterIP | default "" }}
    {{- end }}
    - to:
        {{- if $dnsIP }}
        - ipBlock:
            cidr: {{ printf "%s/32" $dnsIP | quote }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        {{- end }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.egress.kubeApi.enabled }}
    {{- $userCidrs := .Values.networkPolicy.egress.kubeApi.cidrs }}
    {{- $kubeSvc := (lookup "v1" "Service" "default" "kubernetes") }}
    {{- $kubeIP := "" }}
    {{- if $kubeSvc }}
    {{- $kubeIP = $kubeSvc.spec.clusterIP | default "" }}
    {{- end }}
    {{- if or $userCidrs $kubeIP }}
    - to:
        {{- if $userCidrs }}
        {{- range $userCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- else if $kubeIP }}
        - ipBlock:
            cidr: {{ printf "%s/32" $kubeIP | quote }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- /* Optional external webhook egress rule */}}
    {{- if and .Values.networkPolicy.egress.webhook .Values.networkPolicy.egress.webhook.enabled }}
    {{- $wh := .Values.networkPolicy.egress.webhook }}
    {{- if or $wh.cidrs $wh.hostCidrs }}
    - to:
        {{- /* Support both cidrs (new) and legacy hostCidrs */}}
        {{- if $wh.cidrs }}
        {{- range $wh.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- else if $wh.hostCidrs }}
        {{- range $wh.hostCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- end }}
      ports:
        {{- if $wh.ports }}
        {{- range $wh.ports }}
        - port: {{ .port }}
          protocol: {{ .protocol | default "TCP" }}
        {{- end }}
        {{- else }}
        - port: 443
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- end }}
    {{- /* Meilisearch / additional namespace egress rule */}}
    {{- $allowed := .Values.networkPolicy.egress.allowedNamespaces }}
    {{- $nsSel := .Values.networkPolicy.egress.namespaceSelector }}
    {{- if or (and $allowed (gt (len $allowed) 0)) (and $nsSel (gt (len (toYaml $nsSel)) 0)) }}
    - to:
        {{- if and $allowed (gt (len $allowed) 0) }}
        {{- range $allowed }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- else if and $nsSel (gt (len (toYaml $nsSel)) 0) }}
        - namespaceSelector:
            {{- toYaml $nsSel | nindent 12 }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.egress.ports }}
        - port: {{ .port }}
          protocol: {{ .protocol | default "TCP" }}
        {{- end }}
    {{- end }}
{{- end }}
