[package]
name = "meili-shared"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.100"
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.9.2"
kube = { version = "2.0.1" }
meilisearch-sdk = "0.30.0"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
meili-crds = { path = "../meili-crds" }
tokio = { version = "1.48.0", features = ["macros", "rt", "time"] }
once_cell = "1.21.3"
k8s-openapi = { version = "0.26.0", features = ["latest"] }
