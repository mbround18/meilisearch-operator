[package]
name = "meili-metrics"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.100"
tracing = "0.1.41"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
actix-web = "4.11.0"
prometheus = { version = "0.14.0", default-features = false, features = ["process"] }
tokio = { version = "1.48.0", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "json"] }
meilisearch-sdk = "0.33.0"
kube = { version = "2.0.1", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.26.0", features = ["latest", "schemars"] }
meili-crds = { path = "../meili-crds" }
meili-shared = { path = "../meili-shared" }
